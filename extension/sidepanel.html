<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header>
      <div class="title"><span class="dot" id="status"></span> Ovis Screen Assistant</div>
      <div class="header-right">
        <label class="toggle" title="Reflective reasoning (slower, deeper)">
          <input type="checkbox" id="deep" /> Deep Analysis
        </label>
        <button id="newchat" title="New chat — clears this session's context">＋ New</button>
      </div>
    </header>

    <div id="chat"></div>

    <div id="preview" class="preview hidden">
      <img id="thumb" alt="captured tab" />
      <button id="clearShot" title="Remove screenshot">✕</button>
    </div>

    <footer>
      <button id="capture" title="Capture the visible tab">📸 Capture tab</button>
      <textarea id="prompt" rows="2" placeholder="Ask about the screen…"></textarea>
      <button id="send">Send</button>
    </footer>
    <script src="sidepanel.js"></script>
  </body>
</html>
